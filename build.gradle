plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 2.x — the current NeoForge build plugin
    id 'net.neoforged.moddev' version '2.0.144'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

// 26.1 runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// EMI has no 26.x NeoForge build to compile against. The plugin stays in the tree so it can come
// back in a single commit the day one appears, rather than being written a second time.
sourceSets.main.java {
    exclude 'dev/drimoz/portablebeacons/compat/emi/**'
}

neoForge {
    version = project.neo_version

    // No parchment block: Mojang dropped obfuscation in 26.1, so the real parameter names ship with
    // the game and there is no mapping left to keep in sync.

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        /**
         * A second client, for the one thing a single client cannot show: whether the aura actually
         * reaches another player.
         *
         * Its own game directory, for the reason the game test run needed one - runs that share
         * run/ share run/mods and each other's saves. Its own username too, because the server
         * rejects a second connection under a name already online.
         *
         * Usage: runServer, then runClient and runClient2, and connect both to localhost.
         */
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll '--username', 'Dev2'
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Runs every @GameTest headlessly and exits non-zero if any fails, so the in-game tests
        // are runnable the same way the unit tests are rather than only through /test in a client.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Its own directory, so the dev-only mods copied into run/mods stay out of it. Sharing
            // run/ meant Curios loaded here too and every test failed on its join-time sync packet,
            // which a synthetic player's connection refuses - a result about the folder's contents,
            // not about this mod.
            gameDirectory = project.file('run-gametest')
        }
        // Datagen is split in two from 1.21.4 on: the client run owns anything that needs assets
        // (item models), the server run owns recipes, advancements and tags. The single data() run
        // 1.21.1 used no longer exists.
        /**
         * Datagen is two runs since 1.21.4, and they must not share an output folder.
         *
         * <p>The generator purges anything under its output that the providers it just ran did not
         * write, deciding from the .cache index. Pointed at one folder, whichever run went second
         * deleted the other half - which is how the mod ended up with models and no recipes, then
         * recipes and no models. Separate folders, separate caches, both on the resource path.
         *
         * <p>Own game directory too: run/mods holds whatever was last copied there, and datagen
         * needs no mods at all.
         */
        clientData {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id,
                    '--output', file('src/generated/client/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        serverData {
            serverData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id,
                    '--output', file('src/generated/server/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            // gameDirectory is set per run, not here: configureEach would overwrite the game test
            // run's own directory depending on when each run is realised.
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft on the test classpath. The core/ tests only need types like ResourceKey,
    // but without this the test source set sees no Minecraft classes at all.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'TheIllusiveC4 (Curios)'
        url = 'https://maven.theillusivec4.top'
    }
}

configurations {
    // Mods to drop into the dev run folder. See copyDevMods below.
    devMods
}

dependencies {
    // JEI and Curios, for the dev environment only. Neither is required to play.
    //
    // These go through the run folder rather than onto the run classpath. A jar on
    // additionalRuntimeClasspath is loadable but is never registered as a mod - FML discovers mods
    // from mods/, so both sat on the classpath and never appeared in the mod list at all.
    devMods "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"
    devMods "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Both are soft dependencies: compiled against, never required. Each integration is isolated
    // so the mod runs identically without them - Curios behind a load check, JEI behind a class
    // only JEI itself ever loads.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    // Pure-logic classes under core/ are plain Java and unit-testable.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 stopped putting the launcher on the test runtime classpath itself.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/**
 * Puts the dev-only mods where FML will actually find them.
 *
 * Deliberately not wired to the game test run - and, more to the point, that run has its own game
 * directory. Not wiring the task was not enough on its own: the jars stay in run/mods once copied,
 * and every run shared that folder, so the tests loaded Curios anyway and all seven failed on its
 * join-time sync packet.
 *
 * A Sync rather than a Copy, so run/mods holds exactly this branch's dev mods. A Copy only ever
 * adds: run/ is shared with the 1.21.1 branch, its JEI, Curios and EMI jars stayed behind next to
 * the 26.1 ones, and EMI's 1.21.1 mixins failed to apply and stopped the client loading at all.
 * The cost is that a jar dropped into run/mods by hand is removed on the next run.
 */
var copyDevMods = tasks.register('copyDevMods', Sync) {
    from configurations.devMods
    into file('run/mods')
}

// The second client has its own directory, so it needs its own copy.
var copyDevMods2 = tasks.register('copyDevMods2', Sync) {
    from configurations.devMods
    into file('run-client2/mods')
}

/**
 * Ops both dev players on the dedicated server.
 *
 * Without this they join in survival with no permissions, which makes the server useless for
 * testing anything - you cannot even give yourself a pack. The server rewrites ops.json when it
 * stops, so this runs before every start rather than once.
 *
 * The UUIDs are the offline-mode ones: with online-mode=false the server derives a player's id from
 * "OfflinePlayer:<name>" as a version 3 UUID, which is exactly what nameUUIDFromBytes produces.
 */
var devOps = tasks.register('devOps') {
    doLast {
        var entries = ['Dev', 'Dev2'].collect { name ->
            var uuid = UUID.nameUUIDFromBytes("OfflinePlayer:${name}".getBytes('UTF-8'))
            '  {"uuid": "' + uuid + '", "name": "' + name + '", "level": 4, ' +
                    '"bypassesPlayerLimit": false}'
        }
        var file = project.file('run/ops.json')
        file.parentFile.mkdirs()
        file.text = '[\n' + entries.join(',\n') + '\n]\n'
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn copyDevMods
}
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn devOps
}
tasks.matching { it.name == 'runClient2' }.configureEach {
    dependsOn copyDevMods2
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
// Generated resources are committed, so a clone builds without running datagen first.
sourceSets.main.resources.srcDir 'src/generated/client'
sourceSets.main.resources.srcDir 'src/generated/server'
neoForge.ideSyncTask generateModMetadata

// Both licences travel with the jar. A distributed artifact that does not carry its own terms
// leaves anyone who only has the file with no way to know them.
tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xlint:deprecation'
    // javac stops reporting after 100 errors by default, which during a port hides most of the
    // work behind the first hundred symptoms. Remove once the port compiles.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        from components.java
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
