modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DrimoZ/PortableBeacons/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/DrimoZ/PortableBeacons"
# A square icon: logoFile is deprecated as of 26.2, split into iconFile (square) and bannerFile.
iconFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Declared so the loader and the store page both show it as optional rather than leaving players to
# guess. It is not required, and the mod behaves identically without it.
#
# EMI is deliberately not listed here: there is no 26.x NeoForge build, so the plugin is not
# compiled into this jar. Advertising it as optional would read as broken rather than absent.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
