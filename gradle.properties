org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft moved to year.drop.hotfix versioning in December 2025 - there is no 1.22, the line
# continues as 26.1, 26.2 and so on. NeoForge gained a fourth component to match: 26.1.2.95 is
# Minecraft 26.1 hotfix 2, NeoForge build 95.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
# Bounded above rather than open-ended: each drop gets its own published file, so a 26.2 jar has no
# business claiming to run on 26.3.
neo_version_range=[26.2.0.88,26.3)
loader_version_range=[4,)

mod_id=portablebeacons
mod_name=Portable Beacons
# Shown verbatim in the in-game mod list, so it states both halves - saying just
# "MIT" there would be a claim about the assets that LICENSE-ASSETS contradicts.
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=1.1.0
mod_group_id=dev.drimoz.portablebeacons
mod_authors=DrimoZ
mod_description=Portable, data-driven beacon effects in an item. Four tiers, augments, fuel.

# Dev-environment only (runtimeOnly), not a shipped dependency.
jei_minecraft_version=26.2
jei_version=30.39.0.232
curios_version=16.0.0+26.2
# EMI is absent on purpose: there is no 26.x NeoForge build to compile against, on CurseForge or
# Modrinth. The plugin source stays in the tree and is excluded from compilation in build.gradle.
