org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
# Exactly 1.21.1. The old [1.21.1,1.22) also accepted 1.21.2 through 1.21.11, which this build
# categorically does not run on - ten primers of breaking changes start at 1.21.2, which is the
# entire reason the 26.1 branch exists.
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# Bounded above too: open-ended, this accepted NeoForge 26.x.
neo_version_range=[21.1,21.2)
loader_version_range=[4,)

mod_id=portablebeacons
mod_name=Portable Beacons
# Shown verbatim in the in-game mod list, so it states both halves - saying just
# "MIT" there would be a claim about the assets that LICENSE-ASSETS contradicts.
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=2.0.0
mod_group_id=dev.drimoz.portablebeacons
mod_authors=DrimoZ
mod_description=Portable, data-driven beacon effects in an item. Four tiers, augments, fuel.

# Dev-environment only (runtimeOnly), not a shipped dependency.
jei_minecraft_version=1.21.1
jei_version=19.44.0.401
curios_version=9.5.1+1.21.1
emi_version=1.1.24+1.21.1
